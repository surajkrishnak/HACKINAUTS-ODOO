version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: brightloop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brightloop
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
