{% extends "base.html" %}

{% block title %}403 Forbidden - Brightloop{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <div class="mb-4">
                <i class="bi bi-shield-lock-fill text-danger" style="font-size: 4rem;"></i>
            </div>
            <h1 class="display-6 fw-bold text-danger mb-3">403 - Access Forbidden</h1>
            <p class="text-muted fs-5 mb-4">
                {{ exception|default:"You do not have the required permissions or role to access this page." }}
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-primary px-4">
                    <i class="bi bi-house-door me-2"></i>Return Home
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-2"></i>Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
