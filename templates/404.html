{% extends "base.html" %}

{% block title %}404 Not Found - Brightloop{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <div class="mb-4">
                <i class="bi bi-compass text-warning" style="font-size: 4rem;"></i>
            </div>
            <h1 class="display-6 fw-bold text-dark mb-3">404 - Page Not Found</h1>
            <p class="text-muted fs-5 mb-4">
                The resource you are looking for does not exist, has been removed, or you do not have permission to view it.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="/" class="btn btn-primary px-4">
                    <i class="bi bi-house-door me-2"></i>Return Home
                </a>
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-2"></i>Go Back
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
