{% extends "base.html" %}

{% block title %}Password Reset Complete - Brightloop Software{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 p-4 bg-white text-center">
            <div class="mb-3">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 3.5rem;"></i>
            </div>
            <h2 class="h4 fw-bold mb-3">Password Successfully Reset</h2>
            <p class="text-muted mb-4">
                Your password has been securely updated. You can now log into Brightloop using your new credentials.
            </p>
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
